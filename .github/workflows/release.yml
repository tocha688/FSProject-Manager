name: Release

# 触发方式：
#   1) 推送 v* 标签（如 v0.1.0）→ 构建并发布 Release
#   2) 手动触发（workflow_dispatch）→ 只出构建产物，不创建 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先跑测试，测试不过就不发布
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Frontend unit tests
        run: npx vitest run

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Rust unit tests
        run: cargo test --lib
        working-directory: src-tauri

  build:
    name: Build & Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      # 校验 tag 与配置里的版本一致，避免发出版本号对不上的包
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG_VERSION package=$PKG_VERSION tauri=$TAURI_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::版本不一致：tag=$TAG_VERSION package=$PKG_VERSION tauri=$TAURI_VERSION"
            exit 1
          fi

      - name: Build Tauri app
        run: npm run tauri build

      - name: List bundle artifacts
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" \) \
            -exec ls -lh {} \;

      # 上传构建产物（即使不发 Release 也能在 Actions 页面下载）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 项目快搜 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
