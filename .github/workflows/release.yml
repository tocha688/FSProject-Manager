name: Release

# 触发方式：
#   1) 推送 v* 标签（如 v0.1.1）→ 三平台构建、发布 Release
#   2) 手动触发（workflow_dispatch）→ 只出构建产物，不创建 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先跑测试，测试不过就不发布
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci

      - name: Frontend unit tests
        run: npx vitest run

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Rust unit tests
        run: cargo test --lib
        working-directory: src-tauri

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: windows
          - name: Linux
            os: ubuntu-22.04
            artifact: linux
          - name: macOS
            os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Linux 构建 Tauri 需要的系统依赖
      # 注意：libappindicator3-dev 与 libayatana-appindicator3-dev 在 Ubuntu 22.04
      # 上互斥（后者 Conflicts 前者），Tauri 2 用 ayatana 版本，不要两个都装。
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev libgtk-3-dev

      - name: Install npm deps
        run: npm ci

      # 校验 tag 与配置里的版本一致，避免发出版本号对不上的包
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG_VERSION package=$PKG_VERSION tauri=$TAURI_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::版本不一致：tag=$TAG_VERSION package=$PKG_VERSION tauri=$TAURI_VERSION"
            exit 1
          fi

      - name: Build Tauri app
        env:
          # 更新包必须签名，私钥从仓库 Secrets 读取
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # 便携版：解压即用，不需要安装
      - name: Build portable package
        run: node scripts/portable.mjs

      - name: List artifacts
        shell: bash
        run: |
          echo "=== installers ==="
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) \
            -exec ls -lh {} \; 2>/dev/null || true
          echo "=== portable ==="
          ls -lh src-tauri/target/release/bundle/portable/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/portable/*.zip
            src-tauri/target/release/bundle/portable/*.tar.gz

  # 三平台构建全部成功后再发布，避免发出残缺版本
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 用 Node 复制而不是 bash find：bash 在非 UTF-8 locale 下处理中文文件名
      # 会把前缀截断（曾导致 项目快搜_0.1.2_x64-setup.exe 变成 _0.1.2_x64-setup.exe）
      - name: Flatten artifacts
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const out = "release-files";
          fs.mkdirSync(out, { recursive: true });
          const exts = [".exe", ".msi", ".deb", ".AppImage", ".dmg", ".zip", ".tar.gz", ".sig"];
          const seen = new Set();
          (function walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) { walk(p); continue; }
              if (!exts.some((x) => e.name.endsWith(x))) continue;
              if (seen.has(e.name)) {
                console.warn("跳过重名:", e.name);
                continue;
              }
              seen.add(e.name);
              fs.copyFileSync(p, path.join(out, e.name));
              console.log("+", e.name);
            }
          })("artifacts");
          '

      - name: Generate latest.json
        shell: bash
        run: |
          node scripts/latest-json.mjs release-files "${{ github.repository }}" "${{ github.ref_name }}"
          echo "=== latest.json ==="
          cat release-files/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 项目快搜 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
